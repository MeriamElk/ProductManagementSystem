<mat-sidenav-container class="layout">
  <mat-sidenav #sidenav mode="side" opened class="sidenav">
    <div class="p-4 font-semibold text-lg">PMS</div>
    <mat-divider></mat-divider>

    <!-- Menu -->
    <mat-nav-list>
      <a mat-list-item routerLink="/products" (click)="sidenav.close()">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>{{ t('products') }}</span>
      </a>
    </mat-nav-list>

    <mat-divider></mat-divider>

    <!-- ✅ Theme switch (US-9.1 : dans le menu/sidenav) -->
    <div class="px-4 py-3">
      <div class="text-sm mb-2">{{ t('theme') }}</div>

      <div class="flex items-center justify-between gap-3">
        <span class="text-xs opacity-80">{{ t('light') }}</span>

        <mat-slide-toggle
          [checked]="isDark"
          (change)="onThemeToggle($event.checked)">
        </mat-slide-toggle>

        <span class="text-xs opacity-80">{{ t('dark') }}</span>
      </div>
    </div>

    <mat-divider></mat-divider>

    <!-- Lang switch -->
    <div class="px-4 py-3 flex items-center justify-between">
      <span class="text-sm">{{ t('language') }}</span>
      <button mat-stroked-button (click)="toggleLanguage()">
        {{ language }}
      </button>
    </div>

    <div class="px-4 pb-4">
      <button mat-stroked-button color="warn" class="w-full" (click)="logout()">
        {{ t('logout') }}
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="toolbar">
      <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="ml-2 font-semibold">{{ t('title') }}</span>

      <span class="spacer"></span>

      <!-- ✅ Theme switch dans la toolbar (US-11.1 : demandé ici) -->
      <span class="mr-2 text-sm">{{ isDark ? t('dark') : t('light') }}</span>
      <mat-slide-toggle
        [checked]="isDark"
        (change)="onThemeToggle($event.checked)">
      </mat-slide-toggle>

      <button mat-button disabled class="ml-3">
        {{ t('products') }}
      </button>
    </mat-toolbar>

    <div class="page">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
