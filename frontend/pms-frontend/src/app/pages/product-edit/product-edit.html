<div class="form-page-wrapper" *ngIf="!notFound; else nf">

  <div class="form-page-header">
    <button mat-icon-button type="button" (click)="cancel()" class="back-btn" aria-label="Back">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <div>
      <h1 class="form-page-title">Edit Product</h1>
      <p class="form-page-subtitle">Update product information</p>
    </div>
  </div>

  <mat-progress-bar *ngIf="loading" mode="indeterminate" class="mb-4" style="border-radius:4px"></mat-progress-bar>

  <div class="form-card">
    <form class="product-form" [formGroup]="form" (ngSubmit)="save()">

      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" />
        <mat-error *ngIf="form.controls.name.touched && form.controls.name.hasError('required')">
          Name is required
        </mat-error>
        <mat-error *ngIf="form.controls.name.touched && form.controls.name.hasError('minlength')">
          Minimum 2 characters
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Description</mat-label>
        <textarea matInput rows="3" formControlName="description"></textarea>
      </mat-form-field>

      <div class="form-row-2col">
        <mat-form-field appearance="outline">
          <mat-label>Price</mat-label>
          <span matTextPrefix style="opacity:.5;margin-right:4px">$</span>
          <input matInput type="number" formControlName="price" min="0" step="0.01" />
          <mat-error *ngIf="form.controls.price.touched && form.controls.price.hasError('min')">
            Price must be ≥ 0
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Quantity</mat-label>
          <input matInput type="number" formControlName="quantity" min="0" step="1" />
          <mat-error *ngIf="form.controls.quantity.touched && form.controls.quantity.hasError('min')">
            Quantity must be ≥ 0
          </mat-error>
        </mat-form-field>
      </div>

      <div class="form-actions">
        <button mat-stroked-button type="button" (click)="cancel()" [disabled]="loading">
          Cancel
        </button>
        <button mat-raised-button color="primary" type="submit" [disabled]="loading || form.invalid">
          <mat-icon>save</mat-icon>
          Save changes
        </button>
      </div>

    </form>
  </div>

</div>

<ng-template #nf>
  <div class="not-found-state">
    <mat-icon>search_off</mat-icon>
    <h2>Product not found</h2>
    <p>This product may have been deleted or doesn't exist.</p>
    <button mat-raised-button color="primary" (click)="cancel()">
      <mat-icon>arrow_back</mat-icon>
      Back to products
    </button>
  </div>
</ng-template>
