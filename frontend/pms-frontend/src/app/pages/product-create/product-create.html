<h2 class="text-xl font-semibold mb-4">Create Product</h2>

<form [formGroup]="form" class="flex flex-col gap-3" (ngSubmit)="save()">
  <mat-form-field appearance="outline">
    <mat-label>Name</mat-label>
    <input matInput formControlName="name" />
    <mat-error *ngIf="form.controls.name.hasError('required')">Name required</mat-error>
    <mat-error *ngIf="form.controls.name.hasError('minlength')">Min length 2</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Description</mat-label>
    <input matInput formControlName="description" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Price</mat-label>
    <input matInput type="number" formControlName="price" />
    <mat-error *ngIf="form.controls.price.hasError('min')">Price must be > 0</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Quantity</mat-label>
    <input matInput type="number" formControlName="quantity" />
    <mat-error *ngIf="form.controls.quantity.hasError('min')">Quantity must be >= 0</mat-error>
  </mat-form-field>

  <div class="flex gap-2">
    <button mat-raised-button color="primary" [disabled]="form.invalid || saving">Save</button>
    <button mat-button type="button" (click)="cancel()">Cancel</button>
  </div>
</form>
